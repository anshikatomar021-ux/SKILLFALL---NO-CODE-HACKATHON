kind = "web"
previewPath = "/"
title = "SkillFall"
version = "1.0.0"
id = "artifacts/skillfall"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23792

[services.development]
run = "pnpm --filter @workspace/skillfall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillfall", "run", "build" ]
publicDir = "artifacts/skillfall/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23792"
BASE_PATH = "/"
